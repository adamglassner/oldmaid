<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"IM Fell English";src:url(../web/fonts/IMFellEnglish-Regular.ttf)}
@font-face{font-family:"IM Fell English";font-style:italic;src:url(../web/fonts/IMFellEnglish-Italic.ttf)}
@font-face{font-family:"IM Fell English SC";src:url(../web/fonts/IMFellEnglishSC-Regular.ttf)}
body{margin:0;background:#222}</style></head><body><script src="../web/art.js"></script><script>
window.out={};
(async()=>{for(const f of ['40px "IM Fell English"','40px "IM Fell English SC"','italic 30px "IM Fell English"'])await document.fonts.load(f);
const card=(id)=>{const s=id[0],r=+id.slice(1);return Art.face({r,s,maid:id==='S12'})};
function baize(c,w,h){const g=c.createRadialGradient(w*.5,h*.42,10,w*.5,h*.5,Math.max(w,h)*.75);g.addColorStop(0,'#3a7a54');g.addColorStop(.55,'#245a3c');g.addColorStop(1,'#0f2c1c');c.fillStyle=g;c.fillRect(0,0,w,h);
 for(let i=0;i<w*h/60;i++){c.fillStyle=Math.random()<.5?`rgba(255,255,255,${Math.random()*.04})`:`rgba(0,0,0,${Math.random()*.07})`;c.fillRect(Math.random()*w,Math.random()*h,1,2)}}
function fan(c,cx,by,cardW,ids,spread){const n=ids.length;const order=ids.map((id,i)=>i).sort((a,b)=>Math.abs(b-(n-1)/2)-Math.abs(a-(n-1)/2));order.forEach(i=>{const id=ids[i];const k=i-(n-1)/2;c.save();c.translate(cx+k*cardW*.36,by);c.rotate(k*spread*Math.PI/180);c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=cardW*.12;c.shadowOffsetY=cardW*.05;
 const cv=card(id),ch=cardW*Art.CH/Art.CW;c.drawImage(cv,-cardW/2,-ch,cardW,ch);c.restore();});}
// icon
{const cv=Art.icon(1024);out.icon=cv.toDataURL();}
// cover 800x1000
{const W=800,H=1000,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');baize(c,W,H);
 const v=c.createRadialGradient(W/2,H*.35,50,W/2,H*.4,H*.8);v.addColorStop(0,'rgba(255,200,120,.22)');v.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=v;c.fillRect(0,0,W,H);
 const d=Art.doily(700);c.globalAlpha=.85;c.drawImage(d,90,440,620,620);c.globalAlpha=1;
 fan(c,W/2,H*0.97,240,['H13','D12','S12','S11','C1'],14);
 c.textAlign='center';c.fillStyle='#f6e7c6';c.shadowColor='rgba(0,0,0,.7)';c.shadowBlur=18;c.font='130px "IM Fell English SC"';c.fillText('Old Maid',W/2,300);
 c.shadowBlur=8;c.font='italic 44px "IM Fell English"';c.fillStyle='#e2c27a';c.fillText('A Victorian Parlor Game',W/2,362);
 c.strokeStyle='#e2c27a';c.lineWidth=2;c.beginPath();c.moveTo(W/2-200,392);c.lineTo(W/2+200,392);c.stroke();
 out.cover=cv.toDataURL();}
// hero 2400x840 (launcher banner; text sits on the left)
{const W=2400,H=840,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
 const g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#2a140c');g.addColorStop(.45,'#4a1f16');g.addColorStop(1,'#3a1810');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.strokeStyle='rgba(226,194,122,.08)';c.lineWidth=3;for(let x=0;x<W;x+=60){c.beginPath();for(let y=0;y<=H;y+=10)c.lineTo(x+Math.sin(y/30)*10,y);c.stroke();}
 c.save();c.beginPath();c.ellipse(W*.72,H*1.02,W*.36,H*.62,0,0,Math.PI*2);c.clip();baize(c,W,H);c.restore();
 c.strokeStyle='#c9a24c';c.lineWidth=8;c.beginPath();c.ellipse(W*.72,H*1.02,W*.36,H*.62,0,0,Math.PI*2);c.stroke();
 const v=c.createRadialGradient(W*.72,H*.3,50,W*.72,H*.4,W*.5);v.addColorStop(0,'rgba(255,210,140,.28)');v.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=v;c.fillRect(0,0,W,H);
 fan(c,W*.72,H*1.02,270,['D13','H12','S12','C11','H1'],13);
 const cams=['agatha','colonel','pettigrew'];cams.forEach((w,i)=>{const cm=Art.cameo(w,180);c.save();c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=24;c.drawImage(cm,W*(.56+i*.16)-90,H*.2-90,180,180);c.restore();});
 c.shadowBlur=0;out.hero=cv.toDataURL();}
document.title='ready';})();
</script></body></html>
